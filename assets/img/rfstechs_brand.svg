<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" fill="none">
  <!-- Caixa Ícone com bordas arredondadas e fundo branco -->
  <rect x="2" y="2" width="44" height="44" rx="9" ry="9" fill="#FFFFFF" stroke="#16325c" stroke-width="2.2" />

  <!-- Cérebro e Circuito IA (Azul Escuro Corporativo #16325c) -->
  <g stroke="#16325c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Eixo central vertical -->
    <line x1="23" y1="8" x2="23" y2="33" />

    <!-- Hemisfério Esquerdo: Cérebro Biológico -->
    <!-- Contorno externo ondulado -->
    <path d="M23 8 C18 7.5 13 10 10 14 C7.5 17.5 7.5 22 9.5 25.5 C10.5 27 12 28.5 13.5 30 C16 32 19.5 33 23 33" />
    <!-- Dobras e circunvoluções internas -->
    <path d="M12.5 15.5 C15.5 14.5 18 16.5 19.5 18.5" />
    <path d="M9.5 22 C12.5 21.5 15.5 23.5 17.5 24" />
    <path d="M13 27 C15.5 26.5 18 28 20 28.5" />

    <!-- Hemisfério Direito: Circuito IA & Chips -->
    <!-- Contorno base direito -->
    <path d="M23 8 C27 8 32 10.5 34.5 14 C36.5 17 36.5 21.5 35 25 C33.5 28 30 31.5 26 33" stroke-dasharray="0.5 3.5" stroke-linecap="round" opacity="0.4" />
    
    <!-- Trilhas do circuito -->
    <polyline points="23,12 28.5,12 31.5,15" />
    <polyline points="23,17.5 33,17.5" />
    <polyline points="23,23 28,23 30.5,21 34.5,21" />
    <polyline points="23,28.5 29,28.5 32,31" />

    <!-- Trilhas que descem para fora da base -->
    <polyline points="23,33 23,39 21.5,41" />
    <polyline points="27,31.5 27,36" />
  </g>

  <!-- Pontos/Nós dos Circuitos (Terminais preenchidos) -->
  <g fill="#16325c">
    <circle cx="31.5" cy="15" r="1.6" />
    <circle cx="33" cy="17.5" r="1.6" />
    <circle cx="34.5" cy="21" r="1.6" />
    <circle cx="32" cy="31" r="1.6" />
    <circle cx="21.5" cy="41" r="1.8" />
    <circle cx="27" cy="36" r="1.6" />
  </g>

  <!-- Pílula Roxa "RFS" -->
  <rect x="54" y="6" width="60" height="36" rx="9" fill="#5438dc" />
  <text x="84" y="31.5" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">RFS</text>

  <!-- Texto "techs" em Roxo -->
  <text x="122" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#5438dc" letter-spacing="-0.3">techs</text>
</svg>
